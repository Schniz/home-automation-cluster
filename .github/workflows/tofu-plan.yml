name: tofu plan

on:
  pull_request:
    paths:
      - "tofu/**"
      - ".github/workflows/tofu-plan.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    environment: home
    strategy:
      matrix:
        workspace: [machine1]
    defaults:
      run:
        working-directory: tofu/workspaces/${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Plan
        shell: bash
        run: |
          set -o pipefail
          # sg: the runner process started before the incus-admin group was added
          sg incus-admin -c "tofu init -input=false -no-color && tofu plan -input=false -no-color -lock-timeout=5m" 2>&1 | tee "$RUNNER_TEMP/plan.txt"

      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@v7
        env:
          WORKSPACE: ${{ matrix.workspace }}
        with:
          script: |
            const fs = require("fs");
            const path = `${process.env.RUNNER_TEMP}/plan.txt`;
            const plan = fs.existsSync(path) ? fs.readFileSync(path, "utf8").slice(-60000) : "(no plan output)";
            const body = [
              `### tofu plan: ${process.env.WORKSPACE}`,
              "```",
              plan,
              "```",
              "",
              "_sent from @Schniz's agent 🤖_",
            ].join("\n");
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });
