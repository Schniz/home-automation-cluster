server:
  http_listen_port: 3200
  grpc_listen_port: 9096

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "127.0.0.1:4417"
        http:
          endpoint: "127.0.0.1:4418"

memberlist:
  bind_addr: [127.0.0.1]
  bind_port: 7947

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9096

storage:
  trace:
    backend: local
    wal:
      path: /data/tempo/wal
    local:
      path: /data/tempo/blocks

live_store:
  wal:
    path: /data/tempo/live-store
  shutdown_marker_dir: /data/tempo/shutdown-marker

backend_scheduler:
  local_work_path: /data/tempo/scheduler

metrics_generator:
  storage:
    path: /data/tempo/generator/wal
    remote_write:
      - url: http://127.0.0.1:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    compaction:
      block_retention: 48h
    ingestion:
      rate_limit_bytes: 26214
      burst_size_bytes: 4194304
    metrics_generator:
      processors: [service-graphs, span-metrics]
      max_active_series: 10000
