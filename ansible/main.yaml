# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible/ansible-lint/main/src/ansiblelint/schemas/ansible.json#/$defs/playbook
---
- name: Set up main host
  hosts: all
  become: false
  vars:
    working_directory: "{{ lookup('env', 'PWD') }}"
    gpg_private_key: "{{ lookup('env', 'PGP_PRIVATE_KEY') }}"
    runner_user: schniz
    runner_labels: [home, linux]
    github_account: Schniz
    github_repo: home-automation-cluster
  tasks:
    - name: Ensure port 53 is free for pihole
      block:
        - name: Disable systemd-resolved from listening on port 53
          become: true
          lineinfile:
            path: /etc/systemd/resolved.conf
            regexp: "^DNSStubListener="
            line: "DNSStubListener=no"
            state: present
          notify:
            - restart systemd-resolved
        - name: Adjust /etc/resolv.conf symlink to point to /run/systemd/resolve/resolv.conf
          become: true
          file:
            src: /run/systemd/resolve/resolv.conf
            dest: /etc/resolv.conf
            state: link
            force: true

    - name: Set up Docker repository
      become: true
      block:
        - name: Create apt keyring directory
          file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: Add Docker GPG key
          get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: "0644"

        - name: Remove legacy Docker repository
          apt_repository:
            repo: deb https://download.docker.com/linux/ubuntu focal stable
            state: absent
            update_cache: false

        - name: Add Docker Repository
          apt_repository:
            repo: "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
            filename: docker
            state: present

    - name: install deps
      become: true
      apt:
        name:
          - gnupg
          - git
          - git-secret
          - docker-ce
          - docker-compose-plugin

          # <kvm>
          # TODO: extract a kvm role
          - qemu-kvm
          - bridge-utils
          - libvirt-daemon-system
          - libvirt-clients
          - libosinfo-bin
          - virt-manager
          - swtpm-tools
          # </kvm>

        state: latest

    - name: Install RustDesk
      block:
        - name: Download RustDesk deb file
          get_url:
            url: https://github.com/rustdesk/rustdesk/releases/download/1.1.9/rustdesk-1.1.9.deb
            dest: /tmp/rustdesk.deb
            mode: 0644

        - name: Install RustDesk
          become: true
          apt:
            deb: /tmp/rustdesk.deb
            state: present

    - name: configure docker
      block:
        - name: Set up Docker log rotation
          become: true
          lineinfile:
            path: /etc/docker/daemon.json
            line: '{"log-driver":"json-file","log-opts":{"max-size":"10m","max-file":"2"}}'
            create: true
          notify:
            - reload docker
        # sudo groupadd docker
        - name: Create "docker" group
          become: true
          group:
            name: "docker"
            state: present
        # sudo usermod -aG docker root
        - name: Add "{{runner_user}}" user to "docker" group
          become: true
          user:
            name: "{{runner_user}}"
            groups:
              - "docker"
            append: yes
        - name: create the "caddy" network in docker
          become: true
          community.docker.docker_network:
            name: caddy
            state: present

    - name: secrets
      block:
        - name: login to ghcr as schniz
          community.docker.docker_login:
            username: schniz
            password: "{{ lookup('env', 'PERSONAL_ACCESS_TOKEN') }}"
            registry_url: ghcr.io

        - name: Import gpg private key
          when: gpg_private_key != ""
          command: gpg --batch --yes --pinentry-mode loopback --import
          args:
            chdir: "{{ working_directory }}"
            stdin: "{{ gpg_private_key }}"

    - name: configure kvm
      block:
        - name: Run kvm-ok
          become: true
          command: kvm-ok
          register: kvm_ok
          failed_when: kvm_ok.rc != 0
        - name: Ensure there's a "libvirt" group
          become: true
          group:
            name: "libvirt"
            state: present
        - name: Add "{{runner_user}}" user to "libvirt" group
          become: true
          user:
            name: "{{runner_user}}"
            groups:
              - "libvirt"
            append: yes

    - name: Add EDITOR=vim to {{runner_user}}
      become: true
      lineinfile:
        path: "/home/{{runner_user}}/.bashrc"
        line: "export EDITOR=vim"
        create: true

  roles:
    - role: monolithprojects.github_actions_runner
      become: true
      when: lookup('env', 'PERSONAL_ACCESS_TOKEN') != ""

  handlers:
    - name: reload docker
      become: true
      service:
        name: docker
        state: reloaded
    - name: restart systemd-resolved
      become: true
      service:
        name: systemd-resolved
        state: restarted
