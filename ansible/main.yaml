# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible/ansible-lint/main/src/ansiblelint/schemas/ansible.json#/$defs/playbook
---
- name: Set up main host
  hosts: all
  become: false
  vars:
    working_directory: "{{ lookup('env', 'PWD') }}"
    gpg_private_key: "{{ lookup('env', 'PGP_PRIVATE_KEY') }}"
    runner_user: schniz
    runner_labels: [home, linux]
    github_account: Schniz
    github_repo: home-automation-cluster
    dust_version: "1.2.6"
    dust_checksum: sha256:c6e247e6097efca343373ab4c91548799d8815c1d84c9a15fa8ea38fc2bb50f8
    rustdesk_version: "1.5.0"
    lgtm_directory: /media/SchlezExt/configs/lgtm
    lgtm_budget_bytes: 21474836480
    rustdesk_checksums:
      x86_64: sha256:4e2b9701d25a7ef373f3d09bda584a37d6902f97a6ab15f2e86d4a5783e2a0ec
      aarch64: sha256:1f2fc9be8321c10347aa33cb13198c6a956aec272c5e58ac81f4c0ef04037df3
  tasks:
    - name: Ensure port 53 is free for pihole
      block:
        - name: Disable systemd-resolved from listening on port 53
          become: true
          lineinfile:
            path: /etc/systemd/resolved.conf
            regexp: "^DNSStubListener="
            line: "DNSStubListener=no"
            state: present
          notify:
            - restart systemd-resolved
        - name: Adjust /etc/resolv.conf symlink to point to /run/systemd/resolve/resolv.conf
          become: true
          file:
            src: /run/systemd/resolve/resolv.conf
            dest: /etc/resolv.conf
            state: link
            force: true

    - name: Set up Docker repository
      become: true
      block:
        - name: Create apt keyring directory
          file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: Add Docker GPG key
          get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: "0644"

        - name: Remove legacy Docker repository
          apt_repository:
            repo: deb https://download.docker.com/linux/ubuntu focal stable
            state: absent
            update_cache: false

        - name: Add Docker Repository
          apt_repository:
            repo: "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
            filename: docker
            state: present

    - name: install deps
      become: true
      apt:
        name:
          - ca-certificates
          - gnupg
          - git
          - git-secret
          - vim
          - ripgrep
          - fd-find
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
          - e2fsprogs

          # <kvm>
          # TODO: extract a kvm role
          - cpu-checker
          - qemu-kvm
          - bridge-utils
          - libvirt-daemon-system
          - libvirt-clients
          - libosinfo-bin
          - virt-manager
          - swtpm-tools
          # </kvm>

        state: latest
        update_cache: true
        cache_valid_time: 3600

    - name: Make fd available under its upstream command name
      become: true
      file:
        src: /usr/bin/fdfind
        dest: /usr/local/bin/fd
        state: link

    - name: Install Dust
      block:
        - name: Download Dust deb file for the x86_64 host
          get_url:
            url: "https://github.com/bootandy/dust/releases/download/v{{ dust_version }}/du-dust_{{ dust_version }}-1_amd64.deb"
            dest: "/tmp/du-dust_{{ dust_version }}-1_amd64.deb"
            checksum: "{{ dust_checksum }}"
            mode: "0644"

        - name: Install Dust
          become: true
          apt:
            deb: "/tmp/du-dust_{{ dust_version }}-1_amd64.deb"
            state: present

    - name: Install RustDesk
      block:
        - name: Download RustDesk deb file
          get_url:
            url: "https://github.com/rustdesk/rustdesk/releases/download/{{ rustdesk_version }}/rustdesk-{{ rustdesk_version }}-{{ ansible_architecture }}.deb"
            dest: "/tmp/rustdesk-{{ rustdesk_version }}-{{ ansible_architecture }}.deb"
            checksum: "{{ rustdesk_checksums[ansible_architecture] }}"
            mode: "0644"

        - name: Install RustDesk
          become: true
          apt:
            deb: "/tmp/rustdesk-{{ rustdesk_version }}-{{ ansible_architecture }}.deb"
            state: present

    - name: configure docker
      block:
        - name: Check for existing Docker configuration
          become: true
          stat:
            path: /etc/docker/daemon.json
          register: docker_daemon_config

        - name: Read existing Docker configuration
          become: true
          slurp:
            src: /etc/docker/daemon.json
          register: docker_daemon_config_content
          when: docker_daemon_config.stat.exists

        - name: Set up Docker log rotation
          become: true
          vars:
            existing_docker_config: "{{ (docker_daemon_config_content.content | b64decode | from_json) if docker_daemon_config.stat.exists else {} }}"
            docker_log_config:
              log-driver: json-file
              log-opts:
                max-size: "10m"
                max-file: "2"
          copy:
            dest: /etc/docker/daemon.json
            content: "{{ existing_docker_config | combine(docker_log_config) | to_nice_json }}\n"
            mode: "0644"
            validate: "dockerd --validate --config-file %s"
          notify:
            - reload docker
        # sudo groupadd docker
        - name: Create "docker" group
          become: true
          group:
            name: "docker"
            state: present
        # sudo usermod -aG docker root
        - name: Add "{{runner_user}}" user to "docker" group
          become: true
          user:
            name: "{{runner_user}}"
            groups:
              - "docker"
            append: yes
        - name: create the "caddy" network in docker
          become: true
          community.docker.docker_network:
            name: caddy
            state: present

    - name: Provision the LGTM disk budget
      become: true
      block:
        - name: Verify the external disk is mounted
          command: mountpoint -q /media/SchlezExt
          changed_when: false

        - name: Create the LGTM mount directory
          file:
            path: "{{ lgtm_directory }}/data"
            state: directory
            mode: "0755"

        - name: Check for the LGTM filesystem image
          stat:
            path: "{{ lgtm_directory }}/data.ext4"
          register: lgtm_image

        - name: Verify the existing filesystem budget
          assert:
            that:
              - lgtm_image.stat.size | int == lgtm_budget_bytes | int
            fail_msg: "The LGTM filesystem image must be exactly 20 GiB."
          when: lgtm_image.stat.exists

        - name: Allocate the 20 GiB filesystem image
          command: "fallocate -l {{ lgtm_budget_bytes }} {{ lgtm_directory }}/data.ext4"
          when: not lgtm_image.stat.exists

        - name: Check the filesystem image format
          command: "blkid -p -s TYPE -o value {{ lgtm_directory }}/data.ext4"
          register: lgtm_image_type
          changed_when: false
          failed_when: lgtm_image_type.rc not in [0, 2]

        - name: Verify the image is empty or ext4
          assert:
            that:
              - lgtm_image_type.stdout in ['', 'ext4']

        - name: Format the new LGTM filesystem
          command: "mkfs.ext4 -m 0 {{ lgtm_directory }}/data.ext4"
          when: lgtm_image_type.stdout == ''

        - name: Mount the budgeted filesystem and persist it in fstab
          ansible.posix.mount:
            path: "{{ lgtm_directory }}/data"
            src: "{{ lgtm_directory }}/data.ext4"
            fstype: ext4
            opts: loop,nodev,nosuid
            state: mounted

        - name: Mark the mounted filesystem for the container startup check
          copy:
            dest: "{{ lgtm_directory }}/data/.lgtm-budget-20gib"
            content: "20 GiB LGTM filesystem\n"
            mode: "0444"

        - name: Create the Docker systemd override directory
          file:
            path: /etc/systemd/system/docker.service.d
            state: directory
            mode: "0755"

        - name: Mount LGTM storage before Docker starts after a reboot
          copy:
            dest: /etc/systemd/system/docker.service.d/lgtm-storage.conf
            content: |
              [Unit]
              RequiresMountsFor={{ lgtm_directory }}/data
            mode: "0644"
          register: lgtm_docker_override

        - name: Reload systemd mount dependencies
          systemd:
            daemon_reload: true
          when: lgtm_docker_override.changed

    - name: secrets
      block:
        - name: login to ghcr as schniz
          community.docker.docker_login:
            username: schniz
            password: "{{ lookup('env', 'PERSONAL_ACCESS_TOKEN') }}"
            registry_url: ghcr.io

        - name: Import gpg private key
          when: gpg_private_key != ""
          command: gpg --batch --yes --pinentry-mode loopback --import
          args:
            chdir: "{{ working_directory }}"
            stdin: "{{ gpg_private_key }}"

    - name: configure kvm
      block:
        - name: Run kvm-ok
          become: true
          command: kvm-ok
          register: kvm_ok
          changed_when: false
          failed_when: kvm_ok.rc != 0
        - name: Ensure there's a "libvirt" group
          become: true
          group:
            name: "libvirt"
            state: present
        - name: Add "{{runner_user}}" user to "libvirt" group
          become: true
          user:
            name: "{{runner_user}}"
            groups:
              - "libvirt"
            append: yes

    - name: Add EDITOR=vim to {{runner_user}}
      become: true
      lineinfile:
        path: "/home/{{runner_user}}/.bashrc"
        line: "export EDITOR=vim"
        create: true

  roles:
    - role: monolithprojects.github_actions_runner
      become: true
      when: lookup('env', 'PERSONAL_ACCESS_TOKEN') != ""

  handlers:
    - name: reload docker
      become: true
      service:
        name: docker
        state: reloaded
    - name: restart systemd-resolved
      become: true
      service:
        name: systemd-resolved
        state: restarted
